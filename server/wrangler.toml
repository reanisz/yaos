name = "yaos"
main = "src/index.ts"
compatibility_date = "2026-03-02"

[[durable_objects.bindings]]
name = "YAOS_SYNC"
class_name = "VaultSyncServer"

[[durable_objects.bindings]]
name = "YAOS_CONFIG"
class_name = "ServerConfig"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultSyncServer", "ServerConfig"]

[[r2_buckets]]
binding = "YAOS_BUCKET"
bucket_name = "yaos"

[observability.logs]
enabled = true

# ---------------------------------------------------------------------------
# Optional hardening variables
# ---------------------------------------------------------------------------
#
# Uncomment YAOS_DISABLE_LEGACY_WS_TOKEN once all plugin clients in your
# deployment have upgraded to a version that supports short-lived WebSocket
# tickets (plugin Release N or later, identified by the capabilities response
# containing "socketTicketAuth": true).
#
# When set to any non-empty string, WebSocket connections that still use the
# legacy ?token= query parameter are rejected with HTTP 401 before the vault
# Durable Object is woken.  Connections using short-lived tickets are
# unaffected.
#
# Upgrade path:
#   1. Deploy this server version (Release N).
#   2. Wait until Worker logs no longer show:
#        "legacy ?token= WebSocket auth for vault <id>"
#   3. Uncomment the line below and redeploy.
#   4. Keep the emergency fallback: if clients break, comment it out again.
#
# [vars]
# YAOS_DISABLE_LEGACY_WS_TOKEN = "true"

# ---------------------------------------------------------------------------
# Admin / debug route gating
# ---------------------------------------------------------------------------
#
# Uncomment YAOS_ENABLE_ADMIN_ROUTES to enable the destructive admin route:
#   POST /__yaos/compact      — force an emergency journal compaction
#
# When this variable is absent or empty the route returns HTTP 404, keeping it
# dark in production.  The read-only GET /__yaos/debug endpoint is always
# available regardless of this setting.
#
# [vars]
# YAOS_ENABLE_ADMIN_ROUTES = "true"

# ---------------------------------------------------------------------------
# Cloudflare Access-gated /admin page (per-vault token management)
# ---------------------------------------------------------------------------
#
# Set BOTH variables below to enable the /admin page and its JSON API:
#   GET  /admin                              — the management page
#   GET  /admin/api/vault-tokens             — list issued tokens
#   POST /admin/api/vault-tokens             — issue / rotate a vault token
#   POST /admin/api/vault-tokens/revoke      — revoke one
#
# With either variable absent or malformed, every /admin path returns the same
# HTTP 404 as any unknown URL, with no Durable Object access — a deployment
# that does not opt in behaves exactly as it did before the feature existed.
#
# Setup:
#   1. Serve this Worker on a custom domain in your zone.  Cloudflare Access
#      protects hostnames and CANNOT be placed in front of a workers.dev URL.
#   2. Create a self-hosted Access application covering <your-domain>/admin
#      and attach the policy that decides who may manage tokens.
#   3. Add both values as SECRETS on the Worker: dashboard → Settings →
#      Variables and Secrets → type "Secret" (or `wrangler secret put
#      YAOS_ACCESS_TEAM_DOMAIN`, then the same for YAOS_ACCESS_AUD).
#
# Secrets are the standard path, not the [vars] block below.  A dashboard-set
# PLAINTEXT variable is removed by the next wrangler-driven deploy (deploys
# replace the plaintext set with this file's [vars]); Secrets survive every
# deploy.  And committed [vars] put deployment facts into the repo, which a
# public deployment repo then publishes.  Neither value is a credential — the
# Secret type is used for its deploy-surviving lifecycle, not its secrecy.
# (Prefer dashboard Text variables?  Add `keep_vars = true` to your own copy
# of this file so deploys stop removing them.  The template leaves that
# default unchanged: it alters variable-sync semantics for every deploy, not
# just this feature's.)
#
# The Worker verifies the Access JWT itself — signature against the team's
# JWKS, issuer, and audience — so the script staying reachable on workers.dev,
# where Access never runs, does not open the page: those requests carry no
# valid token and are refused with 401.
#
# Alternative for a PRIVATE deployment repo — the Worker reads the same env
# either way:
#
# [vars]
# YAOS_ACCESS_TEAM_DOMAIN = "myteam.cloudflareaccess.com"
# YAOS_ACCESS_AUD = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
